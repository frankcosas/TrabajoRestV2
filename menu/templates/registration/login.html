{% extends 'menu/base.html' %}
{% load static %}

{% block content %}
<style>
    .auth-fullscreen {
        position: relative;
        width: 100vw;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        min-height: 85vh;
        background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('{% static "menu/photo-1517248135467-4c7edcad34c4.jpg" %}');
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
        margin-top: -1.5rem;
    }
    .auth-card {
        background: rgba(20, 20, 20, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        color: #fff;
        max-width: 450px;
        width: 100%;
        overflow: hidden;
    }
    .auth-header {
        background: rgba(255, 193, 7, 0.9);
        color: #000;
        font-weight: bold;
        padding: 1rem;
        text-align: center;
        font-size: 1.25rem;
    }
    .auth-card input {
        background: rgba(255, 255, 255, 0.9);
        border: none;
        border-radius: 6px;
        padding: 0.75rem;
    }
</style>

<div class="auth-fullscreen">
    <div class="auth-card">
        <div class="auth-header">Iniciar Sesión - Gourmet Restó</div>
        <div class="p-4">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark mt-3">Entrar</button>
            </form>
            <p class="text-center mt-3 mb-0 text-light">
                ¿No tienes cuenta? <a href="{% url 'registro' %}" class="text-warning text-decoration-none fw-semibold">Regístrate</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
