{% extends 'menu/base.html' %}
{% load static %}

{% block content %}
<style>
    /* Forzar fondo oscuro en toda la página y evitar desbordamientos */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #121212 !important;
        overflow-x: hidden;
    }

    /* Contenedor que cubre absolutamente toda la pantalla sin dejar espacios */
    .form-fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('{% static "menu/fondo platos.png" %}');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000; /* Se coloca sobre cualquier elemento flotante para cubrir toda la vista */
        padding: 1rem;
    }
    
    .form-card {
        background: rgba(20, 20, 20, 0.9);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        color: #fff;
        max-width: 600px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto; /* Permite scroll interno si la pantalla es muy pequeña */
    }

    .form-header {
        background: rgba(40, 167, 69, 0.9);
        color: #fff;
        font-weight: bold;
        padding: 1rem;
        text-align: center;
        font-size: 1.25rem;
    }

    .form-card label {
        color: #f8f9fa;
        font-weight: 500;
        margin-top: 0.4rem;
    }

    .form-card input, 
    .form-card textarea, 
    .form-card select {
        background: rgba(255, 255, 255, 0.95);
        border: none;
        border-radius: 6px;
        padding: 0.5rem;
        width: 100%;
        margin-bottom: 0.4rem;
    }
</style>

<div class="form-fullscreen">
    <div class="form-card">
        <div class="form-header">Agregar Nuevo Plato</div>
        <div class="p-4">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <a href="{% url 'lista_platos' %}" class="btn btn-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-success px-4 fw-bold">Guardar Plato</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
